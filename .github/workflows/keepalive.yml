  workflow_dispatch:

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -s -X GET "https://nvnwqcfgpwzheekninle.supabase.co/rest/v1/" \
